# Pull requests compile the Android shell without downloading the game's cache.
# Fork branch pushes and playable manual runs bundle the game for an installable offline APK.
name: Android

on:
    push:
        branches-ignore: [main]
        paths:
            - android/**
            - scripts/android/**
            - package.json
            - package-lock.json
            - .github/workflows/android.yml
            - .github/workflows/release.yml
    pull_request:
        paths:
            - android/**
            - scripts/android/**
            - package.json
            - package-lock.json
            - .github/workflows/android.yml
            - .github/workflows/release.yml
    workflow_dispatch:
        inputs:
            playable:
                description: Bundle the game and cache for a playable debug APK
                required: true
                default: true
                type: boolean
            coop_url:
                description: Relay URL (blank uses COOP_URL or the public game relay)
                required: false
                type: string
            pause_test:
                description: Install beside the regular app and keep the bundled pause build
                required: true
                default: false
                type: boolean
            publish_run:
                description: Publish the pause-test APK from a successful Android workflow run
                required: false
                default: ""
                type: string

permissions: {}

concurrency:
    group: android-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        if: github.event_name != 'workflow_dispatch' || inputs.publish_run == ''
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            COOP_URL: ${{ inputs.coop_url || (startsWith(github.ref, 'refs/heads/test/android-coop-pause') && 'wss://jere.io/coop') || vars.COOP_URL || 'wss://jere.io/coop' }}
            PAUSE_TEST: ${{ inputs.pause_test || startsWith(github.ref, 'refs/heads/test/android-coop-pause') }}
        steps:
            - name: Choose whether to bundle the game
              id: mode
              env:
                  PLAYABLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.playable) || (github.event_name == 'push' && github.event.repository.fork) }}
              run: echo "playable=$PLAYABLE" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: steps.mode.outputs.playable == 'true'
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              if: steps.mode.outputs.playable == 'true'

            - name: Find the game's cache
              if: steps.mode.outputs.playable == 'true'
              id: game-cache
              run: |
                  name=$(sed -n 's/.*GAME_CACHE_NAME = "\([^"]*\)".*/\1/p' src/game/cache.ts)
                  test -n "$name"
                  echo "name=$name" >> "$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.mode.outputs.playable == 'true'
              id: restore-cache
              with:
                  path: caches
                  key: osrs-cache-${{ steps.game-cache.outputs.name }}

            - name: Download the game's cache
              if: steps.mode.outputs.playable == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
              env:
                  CACHE_NAME: ${{ steps.game-cache.outputs.name }}
              run: |
                  npm run download-caches
                  test -f "caches/$CACHE_NAME/main_file_cache.dat2"
                  test -f caches/caches.json

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.mode.outputs.playable == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
              with:
                  path: caches
                  key: osrs-cache-${{ steps.game-cache.outputs.name }}

            - name: Build the bundled game
              if: steps.mode.outputs.playable == 'true'
              env:
                  VITE_COOP_URL: ${{ env.COOP_URL }}
              run: |
                  npm run build
                  npm run slim-cache
                  node scripts/android/prepare-game.mjs --dist dist

            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: 21

            - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
              with:
                  packages: "platforms;android-36 build-tools;36.0.0"
                  log-accepted-android-sdk-licenses: false

            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  gradle-version: "8.13"
                  cache-provider: basic

            - name: Test and build Android
              working-directory: android
              run: gradle --no-daemon test :app:assembleDebug -PcoopUrl="$COOP_URL" -PpauseTest="$PAUSE_TEST"

            - name: Verify the signed pause test APK
              if: steps.mode.outputs.playable == 'true' && env.PAUSE_TEST == 'true'
              run: |
                  apk=android/app/build/outputs/apk/debug/app-debug.apk
                  tools="$ANDROID_HOME/build-tools/36.0.0"
                  "$tools/apksigner" verify --verbose "$apk"
                  "$tools/aapt" dump badging "$apk" > /tmp/pause-apk-info.txt
                  grep -F "package: name='io.jere.runescapearchive.pausetest'" /tmp/pause-apk-info.txt
                  grep -F "application-label:'Run Escape Pause Test'" /tmp/pause-apk-info.txt
                  grep -R -F 'GAME_UPDATES_ENABLED = false' android/app/build/generated/source/buildConfig/debug
                  python3 - "$apk" <<'PY'
                  import json, sys, zipfile
                  with zipfile.ZipFile(sys.argv[1]) as apk:
                      assert apk.getinfo('assets/game/index.html').file_size > 0
                      caches = json.loads(apk.read('assets/game/caches/caches.json'))
                      assert caches and all(cache.get('slimOf') for cache in caches)
                      scripts = b'\n'.join(apk.read(name) for name in apk.namelist()
                                           if name.startswith('assets/game/assets/') and name.endswith('.js'))
                      for text in [b'Vote to pause', b'Resume everyone', b'Ready to resume']:
                          assert text in scripts, f'Missing pause UI: {text}'
                  PY

            - name: Name the playable APK
              if: steps.mode.outputs.playable == 'true'
              run: |
                  version=$(node -p "require('./package.json').version")
                  mkdir -p release
                  if [ "$PAUSE_TEST" = true ]; then
                      name="Run-Escape-$version-pause-test-android.apk"
                  else
                      name="Run-Escape-$version-android-debug.apk"
                  fi
                  cp android/app/build/outputs/apk/debug/app-debug.apk "release/$name"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.mode.outputs.playable == 'true'
              with:
                  name: ${{ env.PAUSE_TEST == 'true' && 'Run-Escape-Android-pause-test' || 'Run-Escape-Android-debug' }}
                  path: release/Run-Escape-*.apk
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0

    # Publishing a built test APK doesn't execute game or Gradle dependencies.
    publish-pause-test:
        if: github.event_name == 'workflow_dispatch' && inputs.publish_run != '' && inputs.pause_test && startsWith(github.ref, 'refs/heads/test/android-coop-pause')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            SOURCE_RUN: ${{ inputs.publish_run }}
        steps:
            - name: Check the source build
              id: source
              run: |
                  [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
                  gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/source-run.json
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import json, re
                  run = json.load(open('/tmp/source-run.json'))
                  assert run['conclusion'] == 'success' and run['status'] == 'completed'
                  assert run['head_branch'].startswith('test/android-coop-pause')
                  assert run['path'] == '.github/workflows/android.yml'
                  assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
                  print('sha=' + run['head_sha'])
                  PY

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: Run-Escape-Android-pause-test
                  path: release
                  run-id: ${{ inputs.publish_run }}
                  github-token: ${{ github.token }}

            - name: Verify the test app and publish its download
              env:
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
              run: |
                  python3 - <<'PY'
                  import hashlib, json, os, pathlib, zipfile
                  files = list(pathlib.Path('release').glob('Run-Escape-*-pause-test-android.apk'))
                  assert len(files) == 1
                  file = files[0]
                  with zipfile.ZipFile(file) as apk:
                      assert apk.testzip() is None
                      manifest = apk.read('AndroidManifest.xml')
                      for text in ['io.jere.runescapearchive.pausetest', 'Run Escape Pause Test']:
                          assert text.encode() in manifest or text.encode('utf-16le') in manifest
                      assert apk.getinfo('assets/game/index.html').file_size > 0
                      caches = json.loads(apk.read('assets/game/caches/caches.json'))
                      assert caches and all(cache.get('slimOf') for cache in caches)
                      scripts = b'\n'.join(apk.read(name) for name in apk.namelist()
                                           if name.startswith('assets/game/assets/') and name.endswith('.js'))
                      for text in [b'Pause run', b'Resume everyone', os.environ['SOURCE_SHA'][:8].encode()]:
                          assert text in scripts
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  file.with_suffix('.apk.sha256').write_text(f'{digest}  {file.name}\n')
                  print(f'Verified {file.name}: {file.stat().st_size:,} bytes, SHA256 {digest}')
                  PY
                  cat > /tmp/test-notes.md <<'NOTES'
                  Install this APK directly on an Android phone to test co-op pause before merging the feature.

                  It installs as **Run Escape Pause Test** beside the regular app, with separate saves. Its bundled pause build stays installed; upstream game updates are disabled for this test app.

                  Create a Multiplayer room, start the run, open the game's menu and select **Pause run** as host. Guests can select **Request pause**. Everyone ready, or **Resume everyone**, starts a three-second countdown. Everyone in the test room needs this same APK.

                  The public relay supports host-controlled pause. Voting needs the updated relay; the app disables that option when connected to an older server.

                  Debug-signed for testing, with the game and slim cache bundled. No main-branch or PR merge is required.
                  NOTES
                  tag="android-pause-test-${SOURCE_SHA:0:8}"
                  gh release create "$tag" release/*.apk release/*.sha256 \
                    --target "$SOURCE_SHA" --title "Android co-op pause test" \
                    --notes-file /tmp/test-notes.md --prerelease --latest=false
