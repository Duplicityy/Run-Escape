# Pull requests compile the Android shell without downloading the game's cache.
# Fork branch pushes and playable manual runs bundle the game for an installable offline APK.
name: Android

on:
    push:
        branches-ignore: [main]
        paths:
            - android/**
            - scripts/android/**
            - package.json
            - package-lock.json
            - .github/workflows/android.yml
            - .github/workflows/release.yml
    pull_request:
        paths:
            - android/**
            - scripts/android/**
            - package.json
            - package-lock.json
            - .github/workflows/android.yml
            - .github/workflows/release.yml
    workflow_dispatch:
        inputs:
            playable:
                description: Bundle the game and cache for a playable debug APK
                required: true
                default: true
                type: boolean
            coop_url:
                description: Relay URL (blank uses COOP_URL or the public game relay)
                required: false
                type: string
            pause_test:
                description: Install beside the regular app and keep the bundled pause build
                required: true
                default: false
                type: boolean

permissions: {}

concurrency:
    group: android-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            COOP_URL: ${{ inputs.coop_url || (startsWith(github.ref, 'refs/heads/test/android-coop-pause') && 'wss://jere.io/coop') || vars.COOP_URL || 'wss://jere.io/coop' }}
            PAUSE_TEST: ${{ inputs.pause_test || startsWith(github.ref, 'refs/heads/test/android-coop-pause') }}
        steps:
            - name: Choose whether to bundle the game
              id: mode
              env:
                  PLAYABLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.playable) || (github.event_name == 'push' && github.event.repository.fork) }}
              run: echo "playable=$PLAYABLE" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              if: steps.mode.outputs.playable == 'true'
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              if: steps.mode.outputs.playable == 'true'

            - name: Find the game's cache
              if: steps.mode.outputs.playable == 'true'
              id: game-cache
              run: |
                  name=$(sed -n 's/.*GAME_CACHE_NAME = "\([^"]*\)".*/\1/p' src/game/cache.ts)
                  test -n "$name"
                  echo "name=$name" >> "$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.mode.outputs.playable == 'true'
              id: restore-cache
              with:
                  path: caches
                  key: osrs-cache-${{ steps.game-cache.outputs.name }}

            - name: Download the game's cache
              if: steps.mode.outputs.playable == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
              env:
                  CACHE_NAME: ${{ steps.game-cache.outputs.name }}
              run: |
                  npm run download-caches
                  test -f "caches/$CACHE_NAME/main_file_cache.dat2"
                  test -f caches/caches.json

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.mode.outputs.playable == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
              with:
                  path: caches
                  key: osrs-cache-${{ steps.game-cache.outputs.name }}

            - name: Build the bundled game
              if: steps.mode.outputs.playable == 'true'
              env:
                  VITE_COOP_URL: ${{ env.COOP_URL }}
              run: |
                  npm run build
                  npm run slim-cache
                  node scripts/android/prepare-game.mjs --dist dist

            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: 21

            - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
              with:
                  packages: "platforms;android-36 build-tools;36.0.0"
                  log-accepted-android-sdk-licenses: false

            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  gradle-version: "8.13"
                  cache-provider: basic

            - name: Test and build Android
              working-directory: android
              run: gradle --no-daemon test :app:assembleDebug -PcoopUrl="$COOP_URL" -PpauseTest="$PAUSE_TEST"

            - name: Verify the signed pause test APK
              if: steps.mode.outputs.playable == 'true' && env.PAUSE_TEST == 'true'
              run: |
                  apk=android/app/build/outputs/apk/debug/app-debug.apk
                  tools="$ANDROID_HOME/build-tools/36.0.0"
                  "$tools/apksigner" verify --verbose "$apk"
                  "$tools/aapt" dump badging "$apk" > /tmp/pause-apk-info.txt
                  grep -F "package: name='io.jere.runescapearchive.pausetest'" /tmp/pause-apk-info.txt
                  grep -F "application-label:'Run Escape Pause Test'" /tmp/pause-apk-info.txt
                  grep -R -F 'GAME_UPDATES_ENABLED = false' android/app/build/generated/source/buildConfig/debug
                  python3 - "$apk" <<'PY'
                  import json, sys, zipfile
                  with zipfile.ZipFile(sys.argv[1]) as apk:
                      assert apk.getinfo('assets/game/index.html').file_size > 0
                      caches = json.loads(apk.read('assets/game/caches/caches.json'))
                      assert caches and all(cache.get('slimOf') for cache in caches)
                      scripts = b'\n'.join(apk.read(name) for name in apk.namelist()
                                           if name.startswith('assets/game/assets/') and name.endswith('.js'))
                      for text in [b'Vote to pause', b'Resume everyone', b'Ready to resume']:
                          assert text in scripts, f'Missing pause UI: {text}'
                  PY

            - name: Name the playable APK
              if: steps.mode.outputs.playable == 'true'
              run: |
                  version=$(node -p "require('./package.json').version")
                  mkdir -p release
                  if [ "$PAUSE_TEST" = true ]; then
                      name="Run-Escape-$version-pause-test-android.apk"
                  else
                      name="Run-Escape-$version-android-debug.apk"
                  fi
                  cp android/app/build/outputs/apk/debug/app-debug.apk "release/$name"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.mode.outputs.playable == 'true'
              with:
                  name: ${{ env.PAUSE_TEST == 'true' && 'Run-Escape-Android-pause-test' || 'Run-Escape-Android-debug' }}
                  path: release/Run-Escape-*.apk
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
